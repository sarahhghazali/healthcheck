# Services to monitor.
# Only "url" is required. Defaults: method GET, expected_status 200, timeout 5s.
services:
  - name: GitHub
    url: https://github.com

  - name: Google
    url: https://www.google.com
    timeout: 3s

  - name: HTTPBin 204
    url: https://httpbin.org/status/204
    expected_status: 204

  - name: Broken example
    url: https://this-domain-does-not-exist-12345.com
    timeout: 2s
